name: UI Tests

# The workflow only checks out and calls the UITests scripts, so a run reproduces locally with the same commands.

on:
  # Manual run against any branch.
  workflow_dispatch:
  # On release rather than every push, to save CI minutes.
  release:
    types: [published]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per ref: Pages deployments from release-next queue instead of overlapping, and PRs don't wait on each other.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      gallery-uploaded: ${{ steps.upload-pages.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Appium + WinAppDriver
        shell: pwsh
        run: ./UITests/ci-install.ps1 -SetDisplayResolution

      - name: Build + run UI tests
        shell: pwsh
        run: ./UITests/run-ui-tests.ps1

      - name: Upload TestResults artifact (zip)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: UITests/TestResults/**
          if-no-files-found: warn
          retention-days: 30

      # The github-pages environment only accepts release-next, so elsewhere this and deploy-pages are skipped.
      - name: Upload Pages artifact (gallery for browsing)
        id: upload-pages
        if: always() && github.ref == 'refs/heads/release-next'
        uses: actions/upload-pages-artifact@v5
        with:
          path: UITests/TestResults

  deploy-pages:
    needs: ui-tests
    if: always() && needs.ui-tests.outputs.gallery-uploaded == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
