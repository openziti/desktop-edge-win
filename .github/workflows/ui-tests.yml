name: UI Tests

# The workflow only checks out and calls the UITests scripts, so a run reproduces locally with the same commands. The
# integration job also fetches ZET, ziti and dex first, as ziti-tunnel-sdk-c's integration-tests.yml does.

on:
  # Manual run against any branch.
  workflow_dispatch:
  # On release rather than every push, to save CI minutes.
  release:
    types: [published]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per ref: Pages deployments from release-next queue instead of overlapping, and PRs don't wait on each other.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      gallery-uploaded: ${{ steps.upload-pages.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Appium + WinAppDriver
        shell: pwsh
        run: ./UITests/ci-install.ps1 -SetDisplayResolution

      - name: Build + run UI tests
        shell: pwsh
        run: ./UITests/run-ui-tests.ps1

      - name: Upload TestResults artifact (zip)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: UITests/TestResults/**
          if-no-files-found: warn
          retention-days: 30

      # The github-pages environment only accepts release-next, so elsewhere this and deploy-pages are skipped.
      - name: Upload Pages artifact (gallery for browsing)
        id: upload-pages
        if: always() && github.ref == 'refs/heads/release-next'
        uses: actions/upload-pages-artifact@v5
        with:
          path: UITests/TestResults

  # A quickstart of ziti's stable release and the ziti-edge-tunnel release the installer ships. The runner is elevated,
  # which ZET's TUN needs.
  integration-ui-tests:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Appium + WinAppDriver
        shell: pwsh
        run: ./UITests/ci-install.ps1 -SetDisplayResolution

      # Obtains ZET and ziti the way ziti-tunnel-sdk-c's integration-tests.yml does, with ZET at the release
      # Installer/build.ps1 ships.
      - name: Set ZET_BIN
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZET_VERSION=$(sed -n 's/^\$ZITI_EDGE_TUNNEL_VERSION="\(.*\)"$/\1/p' Installer/build.ps1)
          [ -n "$ZET_VERSION" ] || { echo "no \$ZITI_EDGE_TUNNEL_VERSION line in Installer/build.ps1" >&2; exit 1; }
          ZET_ZIP=ziti-edge-tunnel-Windows_x86_64.zip
          mkdir -p zet-release
          (cd zet-release && gh release download --repo openziti/ziti-tunnel-sdk-c "$ZET_VERSION" --pattern "$ZET_ZIP" --clobber && unzip -o "$ZET_ZIP")
          # PowerShell can't resolve an MSYS /d/a/... path; pwd -W emits a Windows path it accepts.
          echo "ZET_BIN=$(pwd -W)/zet-release/ziti-edge-tunnel.exe" >> "$GITHUB_ENV"

      - name: Resolve ziti
        uses: openziti/ziti/setup-cli@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: stable

      - name: Set ZITI_BIN
        shell: bash
        run: echo "ZITI_BIN=$RUNNER_TEMP/ziti-cli/bin/ziti.exe" >> "$GITHUB_ENV"

      # fetch-dex.ps1 sets GOTOOLCHAIN=auto, so any Go downloads the toolchain dex's go.mod asks for.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # dex publishes no binaries, so it is built the way ziti-tunnel-sdk-c's run-ci.ps1 builds it.
      - name: Set IDP_BIN
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "dex"
          ./UITests/fetch-dex.ps1 -Dest $dest
          "IDP_BIN=$(Join-Path $dest 'dex.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build + run integration UI tests
        shell: pwsh
        run: ./UITests/run-ui-tests.ps1 -Category Integration

      - name: Upload TestResults artifact (zip)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-integration
          path: UITests/TestResults/**
          if-no-files-found: warn
          retention-days: 30

  deploy-pages:
    needs: ui-tests
    if: always() && needs.ui-tests.outputs.gallery-uploaded == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
